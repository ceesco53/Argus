name: Argus
options:
  bundleIdPrefix: com.argus
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Argus.xcconfig
  Release: Config/Argus.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
packages:
  ArgusKit:
    path: ArgusKit
targets:
  Argus:
    type: application
    platform: macOS
    sources:
      - path: Argus
        excludes:
          - "Resources/*.entitlements"
          - "Resources/Info.plist"
    dependencies:
      - package: ArgusKit
      - target: ArgusFilter
      - target: ArgusCLI
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Argus
        PRODUCT_BUNDLE_IDENTIFIER: $(ARGUS_BUNDLE_PREFIX).Argus
        INFOPLIST_FILE: Argus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(ARGUS_APP_ENTITLEMENTS_$(ARGUS_FILTER_ENABLED))
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  ArgusFilter:
    type: system-extension
    platform: macOS
    sources:
      - path: ArgusFilter
        excludes:
          - "*.entitlements"
    dependencies:
      - package: ArgusKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        # A system extension's bundle is named after its identifier.
        PRODUCT_BUNDLE_IDENTIFIER: $(ARGUS_BUNDLE_PREFIX).Argus.Filter
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: ArgusFilter
        INFOPLIST_FILE: ArgusFilter/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(ARGUS_FILTER_ENTITLEMENTS_$(ARGUS_FILTER_ENABLED))
        SKIP_INSTALL: YES
  ArgusCLI:
    type: tool
    platform: macOS
    sources:
      - path: ArgusCLI
        excludes:
          - Info.plist
    dependencies:
      - package: ArgusKit
    settings:
      base:
        PRODUCT_NAME: argus
        PRODUCT_BUNDLE_IDENTIFIER: $(ARGUS_BUNDLE_PREFIX).Argus.cli
        INFOPLIST_FILE: ArgusCLI/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
schemes:
  Argus:
    build:
      targets:
        Argus: all
    run:
      config: Debug
    test:
      config: Debug
